{
	# 警告：热键必须始终使用大写英文字母。

	##Hotkeys##
	
	# 若你正在使用 LunaLib，请将此文件视作默认按键配置。在 Luna 菜单重置按键时，
	# 按键将还原为此文件中的设定。若未使用 LunaLib，可直接在此修改热键。但请注意，
	# 后续更新 RTSAssist 会重置此文件。作者后续会对此进行改进，目前建议优先使用 Luna 界面设置。

	# 请注意，在 RTS 模式下，这些按键仅用于本模组，其原本的原版功能将被禁用。
	# 未处于 RTS 模式时，除切换 RTS 模式热键外，其余热键均不生效。

	# 开启/关闭 RTS 模式。留空则默认为 CAPSLOCK 键，亦可设定为你指定的任意按键。

	"enable_RTSMode": "",
	
	# 镜头平移按键。默认从上到下依次为（A, D, W, S）。
	
	"strafeCameraLeft": "A",
	"strafeCameraRight": "D",
	"strafeCameraUp": "W",
	"strafeCameraDown": "S",

	# 将当前所选舰船的相对位置（相对于其整体中心）存入内存。默认按键为 'Q'。

	"saveLayout": "Q",

	# 从内存读取已存舰船阵型，并以当前鼠标位置为中心展开。默认按键为 'E'。

	"loadLayout": "E",

	# 清除所选舰船的全部命令。默认按键为 'X'。

	"deleteAssignments": "X",

	# 命令所选舰船进行排幅。默认按键为 'V'。

	"vent": "V",

	# 命令所选舰船尝试启动战术系统。默认按键为 'F'。

	"useSystem": "F",

	# 命令所有已选舰船协同移动。默认按键为 'R'。

	"moveTogether": "R",

	# 所选舰船向指定位置执行攻击移动。若已有移动命令，将在创建新命令前将其转换为攻击移动。默认按键为 'C'。

	"attackMove": "C",
	
	# 按住以选择舷侧朝向，松开确认；双击则让 AI 自行判断最佳舷侧。默认按键为 'B'。

	"broadsideSelection": "B",

	# 显示/隐藏 RTSAssist 小地图。默认按键为 'G'，填空字符串 "" 则禁用该热键。
	# 小地图默认位于屏幕右下角，按住 Shift 并拖拽可移动其位置（位置会被自动记住）。

	"toggleMiniMap": "G",

	# 按住该键并拖拽鼠标，可平移所有已选舰船的目标位置。
	# 松开鼠标完成操作；提前松开按键可取消操作。

	# 【Alt】 -> 暂不可自定义

	# 按住并拖拽鼠标，可使所有已选舰船围绕鼠标按下时的支点进行旋转。
	# 松开鼠标完成操作；提前松开按键可取消操作。

	# 【Alt + 左 Ctrl】 -> 暂不可自定义

	# 使用以下按键平移镜头。

	# 【strafeCameraLeft】：【A】，-> 暂不可自定义
	# 【strafeCameraRight】：【D】，-> 暂不可自定义
	# 【strafeCameraUp】：【W】，-> 暂不可自定义
	# 【strafeCameraDown】：【S】，-> 暂不可自定义
}